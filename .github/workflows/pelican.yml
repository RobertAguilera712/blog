name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch uses that name
  workflow_dispatch:

jobs:
  deploy:
    uses: "getpelican/pelican/.github/workflows/github_pages.yml@master"
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    with:
      settings: "publishconf.py"
